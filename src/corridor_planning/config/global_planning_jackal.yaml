MapTopic:                   "/nanovoxmap/Voxel_map"
GroundTruthTopic:           "/jackal/ground_truth"
FilteredCloudTopic:         "/filtered_cloud"
PolytopeTopic:              "/jackal/polytopes"

## Planar planning for the Jackal.
# The corridor is generated in (x, y) only; the 3D voxel map is sliced to the
# band of world height the robot body can actually collide with, and everything
# in that band is projected down to the plane.
ObstacleZMin:               0.05   # metres, world frame. Above the floor, so
                                   # ground returns are not obstacles.
ObstacleZMax:               0.80   # metres, world frame. Above the Jackal's
                                   # sensor mast; anything higher it can pass under.

# Robot footprint clearance is applied downstream as trajectory_server's
# SafetyMargin, so no deflation is needed here (deflating the polytope in RISP
# risks pushing the seed outside its own polytope).
DeflationFactor:            0.0

# Planning grid resolution. The Jackal is 0.43 x 0.31 m, so the cells have to
# be a good deal finer than the quadrotor's 0.9 m or doorways disappear.
VoxelResolution:            0.15

# Returns closer than this to the robot are self-hits, and would leave the RISP
# seed with no strictly-feasible interior.
FilterRadius:               0.35

# 2D map extent (x, y) in metres.
MapLowerBound:              [-10.0, -10.0]
MapUpperBound:              [10.0, 10.0]

# 2D start/goal. Start is overwritten by odometry as soon as it arrives; goal
# is overwritten by any RViz "2D Nav Goal" (/move_base_simple/goal).
InitialPose:                [0.0, 0.0]
GoalPose:                   [0.0, 0.0]

# Distance-map planner radii (x, y).
DmPotentialRadius:          [0.6, 0.6]
DmPSearchRadius:            [1.5, 1.5]

# JPS heuristic weight (A* eps). 1.0 = optimal A*; raise it to trade path
# quality for search speed.
JpsHeuristicWeight:         1.0

horizon:                    6

# World z the planar corridor/path/seed markers are drawn at in RViz.
VizHeight:                  0.15
