corridor_planning_node:
  ros__parameters:
    MapTopic:                   "/nanovoxmap/Voxel_map"
    GroundTruthTopic:           "/quadrotor/ground_truth"
    VelodynePoseTopic:          "/velodyne/ground_truth"
    FilteredCloudTopic:         "/filtered_cloud"
    # rviz_default_plugins/SetGoal's default goal topic (see quadrotor_visual.rviz).
    GoalPoseTopic:              "/goal_pose"


    ## warehouse.world
    DeflationFactor:            0.0
    VoxelResolution:            0.9
    FilterRadius:               0.5
    MapLowerBound:              [-20.0, -10.0, -0.3]
    MapUpperBound:              [20.0, 10.0, 2.2]
    InitialPose:                [0.0, 0.0, 0.02]
    GoalPose:                   [0.0, 0.0, 1.0]
    DmPotentialRadius:          [1.0, 1.0, 1.0]
    DmPSearchRadius:            [2.0, 2.0, 2.0]
    horizon:                    6