# --- Topics ---
# Ground-truth odometry for the Jackal base (Gazebo p3d plugin). Provides both
# the pose (position + yaw, needed by the tracking law) and the world-frame
# twist used to seed each replan.
OdometryTopic:             "/jackal/ground_truth"
# Planar safe corridor from corridor_planning.
PolyhedraTopic:            "/jackal/polytopes"
# Velocity command out. Goes straight to the diff_drive_controller; point it at
# twist_mux instead if you want the interactive marker to be able to override.
CmdVelTopic:               "/jackal_velocity_controller/cmd_vel"

# Set true if OdometryTopic reports its twist in the base frame (this is what
# diff_drive_controller does). The Gazebo ground-truth plugin reports world
# frame, so this stays false for the topic above.
OdomTwistInBodyFrame:      false

# --- Dynamic feasibility bounds (GCOPTER magnitudeBounds) ---
# Kept below the diff_drive_controller's own limits (2.0 m/s, 4.0 rad/s in
# jackal_description/config/control.yaml) so the controller never has to clip
# a command the planner considered feasible.
v_max:                     2.0      # max speed (m/s)
a_max:                     1.0      # max acceleration magnitude (m/s^2)
omg_max:                   4.0      # max yaw rate (rad/s); bounds path curvature

# --- Penalty weights for the soft constraints above (GCOPTER penaltyWeights) ---
weight_pos:                10000.0  # corridor containment
weight_vel:                100.0
weight_acc:                100.0
weight_omg:                1000.0   # curvature / yaw-rate limit

# Regularizer on the omega = (v x a)/|v|^2 denominator. The yaw rate of a
# geometric path genuinely diverges as speed goes to zero; this keeps the
# penalty finite there (a diff-drive robot can just rotate in place anyway).
curvature_eps:             0.01

# --- MINCO / L-BFGS optimization settings ---
weight_time:                 50.0   # rho, time-regularization weight
smoothing_eps:               0.01   # penalty smoothing factor
integral_resolution:         16     # integration steps per piece for penalty integral
length_per_piece:            1.0    # desired path length per MINCO piece (m); only used
                                    # when PiecesPerPolytope is 0
PiecesPerPolytope:           1      # MINCO pieces per corridor polytope. 1 puts every
                                    # interior waypoint in an overlap between consecutive
                                    # polytopes -- the tightest parameterization, least room
                                    # to wander. Raise to 2 if the result is too rigid;
                                    # 0 restores length-based allocation.
rel_cost_tol:                1.0e-4 # L-BFGS relative cost convergence tolerance
max_iterations:              1000   # L-BFGS iteration cap per solve; hitting it fails the
                                    # replan and the previous trajectory is kept. 0 = uncapped.

# What derivative the smoothness cost minimizes, and the resulting polynomial
# degree per piece: 3 = minimum jerk, degree-5 (default); 4 = minimum snap,
# degree-7 (smoother/more pieces, more expensive to solve, boundary state
# adds an initial+terminal jerk of 0).
cost_order:                   3

# --- Corridor safety margin ---
# Pushes the trajectory away from the corridor wall (in meters)
# Not guaranteed because GCOPTER is a soft-constraint optimizer, and constraints are guranteed to be 
# satisfied by the MINCO waypoints but not by the continuous trajectory between them. The corridor 
# is already collision-free for the body; this is purely how much extra clearance to leave.
SafetyMargin:                 0.15

# --- Receding horizon ---
ReplanPeriod:                0.5    # seconds between replans
GoalReachedThreshold:        0.25   # metres

# --- Differential-drive tracking law ---
# v     = |v_ref| cos(e_theta) + k_x e_x
# omega = omega_ref + |v_ref| (k_y e_y + k_theta sin(e_theta))
k_x:                         1.0    # along-track error gain
k_y:                         4.0    # cross-track error gain
k_theta:                     2.0    # heading error gain

# Above this heading error the robot stops and rotates in place rather than
# driving off along a badly misaligned heading.
HeadingAlignTolerance:       0.6    # rad
k_align:                     1.5    # in-place rotation gain

# Below this reference speed there is no meaningful direction of travel, so
# the last reference heading is held instead of being recomputed from noise.
LowSpeedThreshold:           0.05   # m/s

# World z the planar trajectory is drawn at in RViz (visualization only).
VizHeight:                   0.15
