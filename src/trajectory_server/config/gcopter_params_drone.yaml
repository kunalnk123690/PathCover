# --- Topics ---
# quadrotor_msgs/State from quadrotor_gazebo_plugin, not the p3d ground_truth
# odometry: every replan seeds its initial boundary condition from the measured
# position, velocity AND acceleration, and nav_msgs/Odometry has no
# acceleration field.
StateTopic:               "/quadrotor/state"
TrajectoryTopic:           "/quadrotor/trajectory"
PolyhedraTopic:             "/quadrotor/polytopes"

# --- Dynamic feasibility bounds (GCOPTER magnitudeBounds) ---
v_max:                     3.0      # max velocity (m/s)
omg_max:                   3.0      # max body rate (rad/s)
theta_max:                 0.7854   # max tilt angle (rad), ~45 deg
thrust_min:                2.0      # min thrust (N)
thrust_max:                10.0     # max thrust (N)

# --- Penalty weights for the soft constraints above (GCOPTER penaltyWeights) ---
weight_pos:                10000.0
weight_vel:                100.0
weight_omg:                10000.0
weight_theta:              10000.0
weight_thrust:             10000.0

# --- Physical parameters (GCOPTER physicalParams / flatness map) ---
vehicle_mass:               0.716     # kg
grav_acc:                   9.81    # m/s^2
horiz_drag:                 0.0     # horizontal drag coefficient
vert_drag:                  0.0     # vertical drag coefficient
paras_drag:                 0.0     # parasitic drag coefficient
speed_eps:                  0.001   # speed smoothing factor (avoids div-by-zero)

# --- MINCO / L-BFGS optimization settings ---
weight_time:                 100.0   # rho, time-regularization weight
smoothing_eps:               0.01   # penalty smoothing factor
integral_resolution:         16      # integration steps per piece for penalty integral
length_per_piece:            2.0   # desired path length per MINCO piece (m); only used
                                    # when PiecesPerPolytope is 0
PiecesPerPolytope:           1      # MINCO pieces per corridor polytope. 1 puts every
                                    # interior waypoint in an overlap between consecutive
                                    # polytopes -- the tightest parameterization, least room
                                    # to wander. Raise to 2 if the result is too rigid;
                                    # 0 restores length-based allocation.
rel_cost_tol:                1.0e-4 # L-BFGS relative cost convergence tolerance
max_iterations:              1000   # L-BFGS iteration cap per solve; hitting it fails the
                                    # replan and the previous trajectory is kept. 0 = uncapped.

# What derivative the smoothness cost minimizes, and the resulting polynomial
# degree per piece: 3 = minimum jerk, degree-5 (default); 4 = minimum snap,
# degree-7 (smoother/more pieces, more expensive to solve, boundary state
# adds an initial+terminal jerk of 0).
cost_order:                   3

# --- Corridor safety margin ---
# Pushes the trajectory away from the corridor wall (in meters)
# Not guaranteed because GCOPTER is a soft-constraint optimizer, and constraints are guranteed to be 
# satisfied by the MINCO waypoints but not by the continuous trajectory between them. The corridor 
# is already collision-free for the body; this is purely how much extra clearance to leave.
SafetyMargin:                 0.15

# --- Receding horizon ---
ReplanPeriod:                0.5    # seconds between replans
GoalReachedThreshold:        0.2    # meters

# --- Yaw control (identical behavior to trajectory_server) ---
YawDotMax:                   1.5707963267948966
LowSpeedThreshold:           0.1
